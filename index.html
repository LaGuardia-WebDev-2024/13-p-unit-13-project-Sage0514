<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 13 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:ital,wght@0,200..700;1,200..700&family=Playwrite+AU+SA:wght@100..400&display=swap" rel="stylesheet">
  </head>
  <body>
    <h1>Quiz About Sage  ⋆🔮✧˚.💜⋆  
    <hr />
    <!-- Movie Question -->
    <form id="major-form">
      <label>
        😉 What is my major?
        <select id="major-answer">
          <option value="major1">dance💃</option>
          <option value="major2">art🎨</option>
          <option value="major3">vocal🎤</option>
          <option value="major4">tech👩🏻‍💻</option>
          <option value="major5">instrumental🎻</option>
          <option value="major5">drama🎭</option>
        </select>
      </label>
      <button type="submit">Check Major Answer</button>
    </form>
    <div id="major-result"></div>
       <div id="major-pic"></div>
    <hr />
    <!-- Book Question -->
    <form id="nature-form">
      <label>
        ☀️ What is my favorite nature spot?
        <select id="nature-answer">
          <option value="nature1">beach˖°𓇼🌊⋆🐚</option>
          <option value="nature2">park🏞️</option>
          <option value="nature3">forest💚🏕️🌿🌲</option>
        </select>
      </label>
      <button type="submit">Check Nature Answer</button>
    </form>
    <div id="nature-result"></div>
    
    <form id="food-form">
      <label>
        🍽️ What is my favorite food?
        <select id="food-answer">
          <option value="food1">burgers🍔</option>
          <option value="food2">pizza🍕</option>
          <option value="food3">tacos🌮</option>
          <option value="food4">sushi🍣🥢</option>
          <option value="food5">pasta🍝</option>
        </select>
      </label>
      <button type="submit">Check Food Answer</button>
    </form>
    <div id="food-result"></div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
      //Movie Question jQuery Code
      $("#major-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#major-answer");
        var answer = $answer.val();

        if (answer === "major3") {
          $("#major-result").text("YESSSS!");
        } else {
          $("#major-result").text("Nuh-Uh!");
        }
      });

      //Book Question jQuery Code
      $("#nature-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#nature-answer");
        var answer = $answer.val();

        if (answer === "nature1") {
          $("#nature-result").text("YUHHHHH!");
        } else {
          $("#nature-result").text("Nah!");
        }
      });
      
        var natureImages = {
        nature1:
          "https://gardenandgun.com/wp-content/uploads/2024/02/Atlantic-Beach_Terry-Ward-1600x1200.jpg",
        park: "",
        forest: "",
      };
            $("#nature-form").on("submit", function (event) {
        event.preventDefault();
        var $natureType = $(this).find("[name=type]"); // scoped
        var natureType = $natureType.val();
        var $img = $("<img>");
        $img.width(100);
        $img.attr("src", natureImages[natureType]);
        $img.appendTo("body");
      });
      
      //Food Question jQuery Code
       $("#food-form").on("submit", function (event) {
        event.preventDefault();
       var $answer = $("#food-answer");
        var answer = $answer.val();

        if (answer === "food5") {
          $("#food-result").text("YUPPPP!");
        } else {
          $("#food-result").text("NOPE!");
        }
      });
      
      
      $("#major-form").animate(
        {
          width: "400px",
          marginLeft: "30px",
          borderWidth: "10px",
      });
      
       $("#nature-form").animate(
        {
          width: "400px",
          marginLeft: "30px",
          borderWidth: "10px",
      });
      
       $("#food-form").animate(
        {
          width: "400px",
          marginLeft: "30px",
          borderWidth: "10px",
      });
      
         $result = $("#food-result");
      $result.hide();
      $("#food-result").hide();
      $result.slideDown(5000);
       $("#food-result").slideDown(5000);
    </script>
    </h1>
  </body>

  <!--- Taken From Khan Academy HTML/JS: Making webpages interactive with jQuery-->
</html>
